# SchoolOps Excel Sync configuration.
# Copy to config.toml. Lines marked TODO must be checked against the REAL school files
# and agreed with the school before mapping_confirmed / payment_rules.confirmed are set to true.

[service]
watch_folder = "C:/SchoolShare/Fees"          # TODO: the shared folder with the class Excel files
database_url = "postgresql://schoolops:CHANGE_ME@localhost:5432/schoolops"
dry_run = true            # keep true until a dry run of the real folder looks correct
debounce_seconds = 5      # wait this long after the last save before reading a file
reconcile_minutes = 30    # full re-check of the folder, in case a save was missed
polling = true            # recommended for OneDrive / network folders (file events can be missed there)
recursive = false         # true if class files are inside sub-folders (e.g. one folder per medium)
log_file = "logs/sync.log"
school_name = "Your School Name"            # used in parent message previews

[layout]
header_row = 2            # TODO: row with the headings (row 1 is the school name in current files)
first_data_row = 3
mapping_confirmed = false # TODO: set true only after the school confirms [columns] and [classification]
test_mode = false

[columns]
# Internal field = exact heading text in Excel (case and extra spaces are ignored).
# Leave a field out if the school does not have that column. student_name and balance are required.
# TODO: confirm every heading below with the school. "2500", the blank columns and
# "old fees pending" are NOT mapped until we know what they mean.
# student_id = ""        # GR no. / admission no. if the school has one (best identity)
# parent_name = ""       # parent/guardian name column, if any
# family_id = ""         # ONLY a verified family/parent ID column. Students with the same value become siblings.
#                        # Never use the phone column here: shared phones only create "Same parent?" questions.
sr_no = "Sr. No."
student_name = "Student Name"
class_label = "Class"
contact = "Contact"
total_fee = "Total Amt"
discount = "Disc. Amt"
paid = "Paid Amt"
balance = "Balance"

# Where class, section and medium come from: the file name, the sheet (tab) name,
# or the Class column. The regex's first group is the value.
# TODO: confirm with the school. Examples below assume files like
# "English - Std 1.xlsx" with tabs like "1 Peacock".
[classification.std]
from = "sheet"
regex = '^(\S+)'

[classification.section]
from = "sheet"
regex = '^\S+\s+(.+)$'

[classification.medium]
from = "file"
regex = '^(Semi-English|English)'

[payment_rules]
# TODO: agree with the school. Until confirmed = true, both of these are forced to "review".
confirmed = false
balance_increase = "review"   # balance went UP since last sync -> hold for a person to check
paid_decrease = "review"      # Paid amount went DOWN -> hold for a person to check

[onedrive]
# Read the class files straight from OneDrive / SharePoint with Microsoft Graph (READ-ONLY).
# Files are downloaded into watch_folder (above), which then acts as a local mirror. Never edit the mirror.
enabled = false
auth = "device_code"            # sign in once as the office user (python -m schoolops_sync onedrive-login)
tenant_id = "organizations"     # TODO: your Microsoft 365 tenant ID or domain ("consumers" for a personal account)
client_id = ""                  # TODO: Application (client) ID of the app registration (see README)
drive_id = ""                   # empty = the signed-in user's own OneDrive
folder_path = "School/Fees"     # TODO: folder inside that drive
folder_item_id = ""             # OR: the id of a folder SHARED with you (then drive_id is required)
recursive = true
poll_minutes = 10
token_cache = "data/onedrive_token.json"   # git-ignored, readable only by you

[messaging]
# No SMS/WhatsApp/email provider is connected. Drafts are prepared for staff to edit, approve and copy.
enabled = false
# Optional: names of your approved WhatsApp templates / DLT-registered SMS templates, shown on drafts.
# whatsapp_templates = { mr = "fee_reminder_mr", hi = "fee_reminder_hi", en = "fee_reminder_en" }
# sms_templates = { mr = "1107xxxxxxxxxxxxxx", hi = "", en = "" }
# Optional: prepare drafts automatically every day (still need approval, still not sent)
auto_drafts = false
auto_drafts_time = "09:00"
auto_drafts_lists = ["missed_promise", "due_soon"]   # also: due_today, not_called, all_unpaid
auto_drafts_channels = ["whatsapp", "sms"]
auto_drafts_language = "mr"
